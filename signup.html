<!DOCTYPE html>
<html lang="en">

<body>
     <div class="signup">
    <h1>Lamrin Tech Skills University,Punjab</h1>
   
         <form>
<label>Rollno</label><br>
<input type="text" placeholder="enter your rollno." required>
<br>
<label>Name</label><br>
<input type="text" placeholder="enter your Name" required><br>
  <label>Address</label>
            <textarea rows="4" placeholder="Enter your address"></textarea>
<br>
<label>Mobile No.</label><br>
<input type="text" placeholder="enter your Mobile no." required>
<br>
 <label>Gender</label>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
<br>
            <label>Course</label>
            <select required>
                <option value="">Select your course</option>
                <option>B.Tech CSE</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>MCA</option>
            </select><br>
              <label>semester</label>
            <select required>
                <option value="">Select your semester</option>
                <option>1 sem</option>
                <option>2 sem</option>
                <option>3 sem</option>
                <option>4 sem</option>
            </select><br>
<button type="submit">SignUp</button><br>
    </div>
</body>
