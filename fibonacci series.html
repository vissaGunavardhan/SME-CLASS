
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fibonacci Series</title>
</head>
<body>
    <h1>For Loops</h1>
    <p>Facbonacci series</p>
    <p id="demo">Hello!</p>

    <script>
        let a = 0;
        let b = 1;
        let c;
        let t = "";

        for(let i = 1; i <= 8; i++) {
            t += a + " ";
            c = a + b;
            a = b;
            b = c;
        }

        document.getElementById("demo").innerHTML = t;
    </script>
</body>
</html>
