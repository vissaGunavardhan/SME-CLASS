<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
</head>
<body>
    <script>
        function func1(){
            document.getElementById("para").style.color="red";
        }
        function func2(){
             document.getElementById("para").style.color="blue";
        }
    function modifyText(){
        const namefield=document.getElementById("name");
        namefield.value=namefield.value.toUpperCase();
    }
        function modifyText() {
            const namefield = document.getElementById("name");
            namefield.style.height = "auto";
            namefield.style.height = namefield.scrollHeight + "px";
        }
    </script>
    <p id="para">WELCOME</p>
     <textarea id="text" placeholder="Write something..." oninput="resizeText(this)"rows="2" cols="10"></textarea>
    
     <h2 onmouseover="func2()">Onmouse OVER event heading example</h2>
    <h2 onmouseout="func1()">Onmouse OUT event heading example</h2>

   
</body>
</html>
