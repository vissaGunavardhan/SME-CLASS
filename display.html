
<!DOCTYPE html>
<html>
<body>

<h3>Even and Odd Numbers from 1 to 100</h3>
<p id="demo"></p>

<script>
for (let i = 1; i <= 100; i++) {
    if (i % 2 == 0) {
        document.getElementById("demo").innerHTML += i + " is Even<br>";
    }
    else {
        document.getElementById("demo").innerHTML += i + " is Odd<br>";
    }
}
</script>

</body>
</html>
