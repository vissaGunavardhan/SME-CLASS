<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Javascript Loops</h1>
   <p>For loop</p>
    <p id="demo">Hello!</p>
    <script>
        let num=3;
        let t="";
        for(let i=1;i<=10;i++){
            t += num+"*"+i+"="+(num*i)+"<br>";
        }
        document.getElementById("demo").innerHTML=t;
    </script>
</body>
</html>
